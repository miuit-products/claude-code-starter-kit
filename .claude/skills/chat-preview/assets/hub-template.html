<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Preview</title>
<style>
  :root{
    --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --brand:#6e5dd3; --brandbg:#ede9fb; --brandink:#4839a1;
    --bad:#b91c1c; --badbg:#fee2e2; --badline:#fca5a5;
    --ok:#15803d; --okbg:#dcfce7; --okline:#86efac;
    --warnbg:#fef3c7; --warnink:#92400e; --warnline:#f59e0b;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    line-height:1.6}
  /* ---- レイアウト（左サイドバー + 右コンテンツ） ---- */
  .shell{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:var(--sidebar-w);flex:0 0 auto;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .sidebar-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;
    color:var(--brandink);display:flex;align-items:center;gap:8px}
  .sidebar-head .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .tabs{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
  .tab-item{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
  .tab-item:hover{background:var(--bg)}
  .tab-item.active{background:var(--brandbg)}
  .tab-title{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab-item.active .tab-title{color:var(--brandink)}
  .tab-sub{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty-hint{padding:16px 18px;color:var(--sub);font-size:12.5px}
  .content{flex:1;overflow-y:auto;padding:32px 20px}
  .wrap{max-width:1080px;margin:0 auto}
  /* ---- 以下、プレビュー本文用のコンポーネントCSS（chat-preview テンプレと同じ） ---- */
  h1{font-size:26px;margin:0 0 4px}
  .lead{color:var(--sub);font-size:15px;margin:0 0 24px}
  h2{font-size:18px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
  h3{margin:0 0 10px;font-size:15px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brandbg);color:var(--brandink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .col-bad{background:var(--badbg);border:1px solid var(--badline)}
  .col-ok{background:var(--okbg);border:1px solid var(--okline)}
  .col-warn{background:var(--warnbg);border:1px solid var(--warnline)}
  .flow{display:flex;flex-direction:column;gap:6px}
  .step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
  .arrow{align-self:center;color:var(--sub);font-size:16px;line-height:1}
  .badtag{color:var(--bad);font-weight:700}
  .oktag{color:var(--ok);font-weight:700}
  .warntag{color:var(--warnink);font-weight:700}
  .ck{list-style:none;padding:0;margin:0}
  .ck li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
  .ck li:last-child{border-bottom:none}
  .box{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
  .done{background:var(--ok)} .todo{background:#94a3b8} .blocked{background:var(--bad)}
  .decide{background:var(--brandbg);border:1px solid var(--brand);border-radius:14px;padding:18px 20px;margin-top:8px}
  .decide h2{margin-top:0;color:var(--brandink)}
  .opt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
  .opt b{color:var(--brandink)}
  .rec{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:2px 8px;margin-left:6px}
  .muted{color:var(--sub);font-size:13px}
  .note{font-size:12.5px;color:var(--sub);margin-top:6px}
  .ex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#0f172a0d;border-radius:6px;padding:1px 6px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:var(--bg)}
  .bar{display:inline-block;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:760px){.grid3{grid-template-columns:1fr}}
  .ng{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:999px;padding:2px 8px;margin-left:6px}
  .kv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;line-height:1.7;overflow-x:auto}
  .kv .k{color:#a5b4fc} .kv .v{color:#86efac} .kv .c{color:#64748b}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0f172a0d;border-radius:5px;padding:1px 5px}
  pre.mermaid,.mermaid{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;overflow-x:auto}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-head"><span class="dot"></span>Chat Preview</div>
    <ul class="tabs" id="tabs"></ul>
  </nav>
  <main class="content">
    <div class="wrap" id="wrap"><p class="muted">読み込み中…</p></div>
  </main>
</div>
<script>
(function () {
  'use strict';
  var DATA_DIR = './data/';
  var POLL_MS = 2500;
  var tabsCache = {}; // key -> { html, loadedVersion }
  var currentKey = null;
  var indexList = [];
  var renderedKey = null;   // いま DOM に描画済みのタブ
  var renderedHtml = null;  // いま DOM に描画済みの HTML（同一なら再描画しない）
  var sidebarSig = '';      // サイドバー再構築の要否判定用シグネチャ

  function b64ToUtf8(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  window.__cp_register = function (key, b64html) {
    var html;
    try {
      html = b64ToUtf8(b64html);
    } catch (e) {
      html = '<p class="muted">プレビューの読み込みに失敗しました。</p>';
    }
    tabsCache[key] = tabsCache[key] || {};
    tabsCache[key].html = html;
    if (key === currentKey) renderContent(key);
  };

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { cb(true); };
    s.onerror = function () { cb(false); };
    document.body.appendChild(s);
    // 読み込み後は掃除（同一URLの再注入を妨げないように）
    s.addEventListener('load', function () { s.remove(); });
    s.addEventListener('error', function () { s.remove(); });
  }

  function relTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 1) return 'たった今';
    if (diffMin < 60) return diffMin + '分前';
    var diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return diffHr + '時間前';
    return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderSidebar() {
    var ul = document.getElementById('tabs');
    // 構造が変わった時だけ再構築する（毎tickの innerHTML 全書き換えはちらつくため）。
    // 相対時刻の表示だけは textContent 更新で常に追従させる。
    var sig = currentKey + '|' + indexList.map(function (i) {
      return i.key + '' + (i.title || '') + '' + (i.updatedAt || '');
    }).join('');
    if (sig === sidebarSig) {
      var subs = ul.querySelectorAll('.tab-item');
      for (var j = 0; j < subs.length; j++) {
        var sub = subs[j].querySelector('.tab-sub');
        if (sub) sub.textContent = relTime(subs[j].getAttribute('data-updated-at'));
      }
      return;
    }
    sidebarSig = sig;
    if (!indexList.length) {
      ul.innerHTML = '<li class="empty-hint">まだプレビューがありません</li>';
      return;
    }
    ul.innerHTML = '';
    indexList.forEach(function (item) {
      var li = document.createElement('li');
      li.className = 'tab-item' + (item.key === currentKey ? ' active' : '');
      li.setAttribute('data-updated-at', item.updatedAt || '');
      var t = document.createElement('div');
      t.className = 'tab-title';
      t.textContent = item.title || item.key;
      var s = document.createElement('div');
      s.className = 'tab-sub';
      s.textContent = relTime(item.updatedAt);
      li.appendChild(t);
      li.appendChild(s);
      li.addEventListener('click', function () { selectTab(item.key); });
      ul.appendChild(li);
    });
  }

  function renderContent(key) {
    var wrap = document.getElementById('wrap');
    var t = tabsCache[key];
    var html = (t && t.html) ? t.html : '<p class="muted">読み込み中…</p>';
    // 同じタブ・同じ内容なら DOM に触らない（毎tickの再描画＝ちらつきの原因）
    if (key === renderedKey && html === renderedHtml) return;
    wrap.innerHTML = html;
    renderedKey = key;
    renderedHtml = html;
    if (t && t.html) maybeRenderMermaid(wrap);
    if (t && t.html) bindMemos(wrap, key);
  }

  // ---- メモ機能（任意）----
  // タブ内の [data-memo="ID"]（textarea / input / checkbox / date）を、このブラウザの localStorage に保存・復元する。
  //   data-memo-label="見出し"  : まとめ出力(data-memo-dump)に使う見出し
  //   data-memo-badge="ID"      : 一覧に「済」「メモ」の目印を出す（done-ID が済、memo-ID が入力済みのとき）
  //   data-memo-dump            : クリックすると全メモを data-memo-dump-target の textarea に書き出してコピーする
  // data-memo が無いタブでは何もしない。保存先はこのPC・このブラウザだけ（他の端末には出ない）。
  function bindMemos(wrap, key) {
    var els = wrap.querySelectorAll('[data-memo]');
    var badges = wrap.querySelectorAll('[data-memo-badge]');
    if (!els.length && !badges.length) return;
    var base = 'cpmemo:' + location.pathname + ':' + key + ':';
    function isCheck(el) { return el.type === 'checkbox'; }
    function val(el) { return isCheck(el) ? (el.checked ? '1' : '0') : el.value; }
    function find(id) { return wrap.querySelector('[data-memo="' + id + '"]'); }
    function refreshBadges() {
      for (var i = 0; i < badges.length; i++) {
        var id = badges[i].getAttribute('data-memo-badge');
        var d = find('done-' + id), m = find('memo-' + id), n = find('next-' + id);
        var t = [];
        if (d && d.checked) t.push('済');
        if (m && m.value.trim()) t.push('メモ');
        if (n && n.value) t.push('次 ' + n.value.slice(5).replace('-', '/'));
        badges[i].textContent = t.join(' ');
      }
    }
    for (var i = 0; i < els.length; i++) (function (el) {
      var k = base + el.getAttribute('data-memo');
      try { var sv = localStorage.getItem(k); if (sv !== null) { if (isCheck(el)) el.checked = sv === '1'; else el.value = sv; } } catch (e) {}
      el.addEventListener(isCheck(el) || el.type === 'date' ? 'change' : 'input', function () {
        try { localStorage.setItem(k, val(el)); } catch (e) {}
        refreshBadges();
      });
    })(els[i]);
    refreshBadges();
    var dumps = wrap.querySelectorAll('[data-memo-dump]');
    for (var j = 0; j < dumps.length; j++) dumps[j].addEventListener('click', function () {
      var out = [];
      for (var q = 0; q < els.length; q++) {
        var lab = els[q].getAttribute('data-memo-label');
        var v = val(els[q]);
        if (!lab || !v || v === '0' || !String(v).trim()) continue;
        out.push('【' + lab + '】' + (isCheck(els[q]) ? '済' : v));
      }
      var tg = wrap.querySelector('[data-memo-dump-target]');
      if (!tg) return;
      tg.value = out.length ? out.join('\n') : '（メモはまだありません）';
      tg.select();
      try { document.execCommand('copy'); } catch (e) {}
    });
  }

  function maybeRenderMermaid(wrap) {
    if (!wrap.querySelector('pre.mermaid, .mermaid')) return;
    try {
      var s = document.createElement('script');
      s.type = 'module';
      s.textContent =
        "import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';" +
        "mermaid.initialize({startOnLoad:false,theme:'neutral',securityLevel:'loose',flowchart:{htmlLabels:true}});" +
        "mermaid.run({querySelector:'.mermaid'});";
      document.body.appendChild(s);
    } catch (e) { /* オフライン時は静かに諦める */ }
  }

  function ensureTabLoaded(key, meta, cb) {
    var cache = tabsCache[key];
    if (cache && cache.loadedVersion === meta.updatedAt) { cb(); return; }
    loadScript(DATA_DIR + key + '.js?v=' + encodeURIComponent(meta.updatedAt || ''), function () {
      tabsCache[key] = tabsCache[key] || {};
      tabsCache[key].loadedVersion = meta.updatedAt;
      cb();
    });
  }

  function selectTab(key) {
    currentKey = key;
    if (history.replaceState) history.replaceState(null, '', '#' + key);
    renderSidebar();
    var meta = indexList.filter(function (i) { return i.key === key; })[0];
    if (!meta) { renderContent(key); return; }
    ensureTabLoaded(key, meta, function () { renderContent(key); });
  }

  function initialKeyFromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return h || null;
  }

  function tick() {
    loadScript(DATA_DIR + 'index.js?v=' + Date.now(), function (ok) {
      if (ok && window.__CP_INDEX__) indexList = window.__CP_INDEX__;
      indexList.sort(function (a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); });

      if (!currentKey) {
        var fromHash = initialKeyFromHash();
        if (fromHash && indexList.some(function (i) { return i.key === fromHash; })) {
          currentKey = fromHash;
        } else if (indexList.length) {
          currentKey = indexList[0].key;
        }
      }

      renderSidebar();

      if (currentKey) {
        var meta = indexList.filter(function (i) { return i.key === currentKey; })[0];
        if (meta) ensureTabLoaded(currentKey, meta, function () { renderContent(currentKey); });
      } else {
        document.getElementById('wrap').innerHTML = '<p class="muted">まだプレビューがありません。chat-preview スキルを実行するとここに追加されます。</p>';
      }
    });
  }

  window.addEventListener('hashchange', function () {
    var h = initialKeyFromHash();
    if (h && h !== currentKey) { currentKey = h; tick(); }
  });

  tick();
  setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
